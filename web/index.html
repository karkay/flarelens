<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1B6B63" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FlareLens" />
  <title>FlareLens — Health &amp; Symptom Trigger Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css?v=10" />
</head>
<body>
  <!-- Password Login / First-Time Setup Gate -->
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">🔒</div>
        <h1 class="auth-title">FlareLens</h1>
        <p id="auth-subtitle" class="auth-subtitle">Sign in to continue.</p>
      </div>
      <div id="auth-form-container"></div>
    </div>
  </div>

  <!-- Main Protected App Shell (hidden until authenticated) -->
  <div id="app" class="app-shell hidden">
    <header class="app-header">
      <div>
        <h1 id="header-title">FlareLens · Today</h1>
        <p id="header-sub" class="header-sub"></p>
      </div>
      <div id="header-right" class="row" style="gap:6px">
        <button id="open-tour-btn" class="btn btn-secondary btn-sm" title="Guided Tour">? Tour</button>
        <button id="lock-app-btn" class="btn btn-secondary btn-sm" title="Lock FlareLens">🔒 Lock</button>
      </div>
    </header>

    <main id="main-content" class="main-content"></main>

    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="today" role="tab">
        <span class="tab-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="tab-btn" data-tab="food" role="tab">
        <span class="tab-icon">📷</span>
        <span>Food Lens</span>
      </button>
      <button class="tab-btn" data-tab="metrics" role="tab">
        <span class="tab-icon">📊</span>
        <span>Metrics</span>
      </button>
      <button class="tab-btn" data-tab="insights" role="tab">
        <span class="tab-icon">✨</span>
        <span>Insights</span>
      </button>
      <button class="tab-btn" data-tab="settings" role="tab">
        <span class="tab-icon">⚙️</span>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Modal / Drawer Container -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-close" aria-label="Close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Guided Tour Overlay -->
  <div id="tour-overlay" class="tour-overlay hidden" role="dialog" aria-modal="true">
    <div id="tour-card" class="tour-card"></div>
  </div>

  <!-- Statistical Tooltip Popover -->
  <div id="tooltip-backdrop" class="tooltip-backdrop hidden" role="dialog" aria-modal="true">
    <div id="tooltip-card" class="tooltip-card"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="./auth-config.js?v=10"></script>
  <script src="./auth.js?v=10"></script>
  <script src="./engine.js?v=10"></script>
  <script src="./health-integrations.js?v=10"></script>
  <script src="./tour-tooltips.js?v=10"></script>
  <script src="./app.js?v=10"></script>
</body>
</html>
